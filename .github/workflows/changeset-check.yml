name: Changeset Check

on:
  pull_request:
    branches:
      - main

jobs:
  changeset-check:
    name: Changeset Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for changeset
        run: |
          # Check if there are any changeset files (excluding README.md and config.json)
          CHANGESETS=$(find .changeset -name "*.md" ! -name "README.md" 2>/dev/null | wc -l)

          if [ "$CHANGESETS" -eq 0 ]; then
            echo "::error::No changeset found. Please run 'pnpm changeset' to create one."
            echo ""
            echo "If this PR doesn't need a changeset (e.g., docs-only changes), you can:"
            echo "1. Add an empty changeset with 'pnpm changeset --empty'"
            echo ""
            exit 1
          fi

          echo "Found $CHANGESETS changeset(s)"
