# Builds a preview tarball of @next-community/adapter-vercel for every push to
# main and every PR, and hands it to the upload_preview_tarballs workflow via
# an artifact. That workflow runs on workflow_run, so it always executes the
# default branch's version of the upload code: a PR can influence the tarball
# bytes but never the code that exchanges the OIDC token for a scoped upload
# URL.
name: build-preview-tarballs

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build preview tarballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The tarball version embeds the head SHA's short form and commit
          # date, which requires the head commit in history (on PRs the
          # checkout is the ephemeral merge commit).
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The head SHA (not github.sha, the ephemeral merge commit on PRs) keeps
      # the version string and the upload path consistent with the commit the
      # /adapter-vercel/prs/:prNumber redirect resolves to.
      - name: Create preview tarballs
        run: node scripts/create-preview-tarballs.js "${{ github.event.pull_request.head.sha || github.sha }}" "$RUNNER_TEMP/preview-tarballs"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-tarballs
          path: ${{ runner.temp }}/preview-tarballs
