name: Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: Check formatting and lint
        run: pnpm run format
      - name: Verify no changes
        run: git diff --exit-code
      - name: Run typecheck
        run: pnpm run typecheck

  enforce-changeset:
    name: Enforce Changeset
    runs-on: ubuntu-latest
    # The changesets bot suffixes the title in pre-release mode ("chore: version
    # packages (beta)"), so match on the prefix rather than the exact title.
    if: "${{ !startsWith(github.event.pull_request.title, 'chore: version packages') }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm exec changeset status --since=origin/main
